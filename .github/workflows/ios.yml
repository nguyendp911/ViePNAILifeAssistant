name: Build iOS unsigned IPA
on:
  push:
    paths:
      - 'ios/**'
      - 'branding/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen librsvg
      - name: Render app icon
        run: |
          mkdir -p ios/ViePNAILife/Resources/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 branding/ViePN-AI-Life-icon.svg > ios/ViePNAILife/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Test native reminder policy (Swift)
        run: |
          swiftc -parse-as-library ios/ViePNAILife/Sources/ReminderPolicy.swift ios/tests/ReminderPolicyTests.swift -o /tmp/viepn-reminder-tests
          /tmp/viepn-reminder-tests
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build for iPhone
        run: |
          xcodebuild -project ios/ViePNAILife.xcodeproj -scheme ViePNAILife -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify embedded app extension
        run: |
          APP=build/Build/Products/Release-iphoneos/ViePNAILife.app
          APPEX="$APP/PlugIns/ViePNShareExtension.appex"
          test -d "$APPEX" || { echo "Share extension is not embedded"; exit 1; }
          PB=/usr/libexec/PlistBuddy
          APP_ID=$($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          EXT_ID=$($PB -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")
          case "$EXT_ID" in "$APP_ID".*) ;; *) echo "Extension id $EXT_ID must be prefixed by $APP_ID"; exit 1;; esac
          for key in CFBundleExecutable CFBundleVersion CFBundleShortVersionString CFBundlePackageType NSExtension:NSExtensionPointIdentifier NSExtension:NSExtensionPrincipalClass; do
            $PB -c "Print :$key" "$APPEX/Info.plist" >/dev/null || { echo "Missing $key in extension Info.plist"; exit 1; }
          done
          for key in CFBundleVersion CFBundleShortVersionString; do
            [ "$($PB -c "Print :$key" "$APP/Info.plist")" = "$($PB -c "Print :$key" "$APPEX/Info.plist")" ] || { echo "$key differs between app and extension"; exit 1; }
          done
          plutil -p "$APPEX/Info.plist"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ViePNAILife.app Payload/
          zip -qry ViePNAILife-V4.8-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ViePNAILife-V4.8-unsigned
          path: ViePNAILife-V4.8-unsigned.ipa
          if-no-files-found: error
