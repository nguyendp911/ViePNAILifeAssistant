name: ViePNAILife
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.9'
  MARKETING_VERSION: '4.2.0'
  CURRENT_PROJECT_VERSION: '42'
  GENERATE_INFOPLIST_FILE: YES
  INFOPLIST_KEY_CFBundleDisplayName: ViePN AI Life
  INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Cho phép nhận dạng giọng nói khi bạn chủ động sử dụng micro.'
  INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Cho phép ghi âm khi bạn nhấn nút nhập giọng nói.'
  INFOPLIST_KEY_NSFaceIDUsageDescription: 'Mở khóa dữ liệu trợ lý cá nhân.'
  TARGETED_DEVICE_FAMILY: '1'
targets:
  ViePNAILife:
    type: application
    platform: iOS
    sources:
      - path: ViePNAILife/Sources
      - path: ViePNAILife/Resources/Assets.xcassets
    dependencies:
      - target: ViePNShareExtension
        embed: true
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.viepn.ailife
      CODE_SIGN_ENTITLEMENTS: ViePNAILife/ViePNAILife.entitlements
      CODE_SIGNING_ALLOWED: NO
  ViePNShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ViePNShareExtension/ShareViewController.swift
    info:
      path: ViePNShareExtension/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.viepn.ailife.share
      CODE_SIGN_ENTITLEMENTS: ViePNShareExtension/ViePNShareExtension.entitlements
      CODE_SIGNING_ALLOWED: NO
      TARGETED_DEVICE_FAMILY: '1'
