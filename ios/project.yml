name: ViePNAILife
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.9'
  MARKETING_VERSION: '4.8.0'
  CURRENT_PROJECT_VERSION: '48'
  GENERATE_INFOPLIST_FILE: YES
  INFOPLIST_KEY_CFBundleDisplayName: ViePN AI Life
  INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Cho phép nhận dạng giọng nói khi bạn chủ động sử dụng micro.'
  INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Cho phép ghi âm khi bạn nhấn nút nhập giọng nói.'
  INFOPLIST_KEY_NSFaceIDUsageDescription: 'Mở khóa dữ liệu trợ lý cá nhân.'
  TARGETED_DEVICE_FAMILY: '1'
targets:
  ViePNAILife:
    type: application
    platform: iOS
    sources:
      - path: ViePNAILife/Sources
      - path: ViePNAILife/Resources/Assets.xcassets
    dependencies:
      - target: ViePNShareExtension
        embed: true
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.viepn.ailife
      CODE_SIGN_ENTITLEMENTS: ViePNAILife/ViePNAILife.entitlements
      CODE_SIGNING_ALLOWED: NO
  ViePNShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ViePNShareExtension/ShareViewController.swift
    # XcodeGen regenerates this Info.plist from `properties` (plus its defaults), so every key the
    # extension needs - notably NSExtension - must be declared here, not only in the checked-in file.
    # Without NSExtension / version keys installd fails with
    # "Failed to create app extension placeholder for .../PlugIns/ViePNShareExtension.appex".
    info:
      path: ViePNShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ViePN AI Life
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      GENERATE_INFOPLIST_FILE: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.viepn.ailife.share
      CODE_SIGN_ENTITLEMENTS: ViePNShareExtension/ViePNShareExtension.entitlements
      CODE_SIGNING_ALLOWED: NO
      TARGETED_DEVICE_FAMILY: '1'
